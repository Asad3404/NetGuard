name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check netguard tests scripts

      - name: Generate synthetic sample PCAPs
        run: python scripts/gen_samples.py --out samples

      - name: Run tests
        run: pytest -q

  build:
    name: build package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check artifacts exist
        run: ls -l dist/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netguard-dist
          path: dist/*
