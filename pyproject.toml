[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netguard"
version = "0.1.0"
description = "A Scapy-based toolkit that both performs (lab-only) and detects classic L2/L3/DNS network attacks."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "asad3404", email = "mustafahassan3404@gmail.com" },
]
keywords = ["security", "scapy", "ids", "arp", "dhcp", "dns", "pcap", "network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

# Pinned runtime dependencies. Scapy is the single heavy dependency; it carries
# its own transitive deps. Versions are pinned for reproducible reviewer runs.
dependencies = [
    "scapy==2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "ruff==0.4.4",
    "build==1.2.1",
]

[project.scripts]
netguard = "netguard.cli:main"

[project.urls]
Homepage = "https://github.com/asad3404/netguard"
Repository = "https://github.com/asad3404/netguard"

[tool.setuptools.packages.find]
include = ["netguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = isort, B = bugbear, UP = pyupgrade.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length is handled by the formatter; long alert strings are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
